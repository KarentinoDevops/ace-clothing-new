name: Build

on: push
    
jobs: 
    build:
        runs-on: ubuntu-latest

        steps:
             - name: checkout code
               uses: actions/checkout@v4

             - name: Use Node.js
               uses: actions/setup-node@v4
               with:
                node-version: 24
                cache: npm 
                
             - run: npm ci
             - run: npm run build --if-present
             - run: npx eslint . --fix


  

       